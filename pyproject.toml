[project]
name = "telegram-message-summarizer"
version = "0.1.0"
description = "Telegram bot for summarizing forwarded messages"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["telegram_summarizer*"]
exclude = ["data*", "tests*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "e2e: end-to-end tests requiring a running bot and Telegram API credentials",
]
addopts = "-m 'not e2e'"
asyncio_mode = "auto"
