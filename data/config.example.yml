# Telegram Message Summarizer Configuration

bot_token: "YOUR_BOT_TOKEN"
openai_api_key: "YOUR_OPENAI_API_KEY"
openai_model: "gpt-4.1-nano"

# Default token limits per user per day
default_limits:
  input_tokens: 10000
  output_tokens: 10000

# HTTP proxy for Telegram API requests (optional, format: user:password@host:port)
proxy_url: ""

# Bot token for end-to-end tests (optional, leave empty to skip e2e tests)
test_bot_token: ""

# Per-user overrides (by Telegram username, without @)
users:
  example_user:
    limits:
      input_tokens: 50000
      output_tokens: 50000
